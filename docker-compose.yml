services:
  findingaid:
    build:
      context: .
      target: development
    volumes:
      - ./app:/app
      - ./public:/public
      - cache:/public/cache
      - ./xml:/xml
      - vendor:/vendor
    networks:
      - app_net

  web:
    image: nginx:1.29.0
    ports:
      - 8080:80
    volumes:
      - ./app:/app
      - ./public:/public
      - cache:/public/cache
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_net
    depends_on:
      - findingaid

networks:
    app_net:
        driver: bridge

volumes:
  vendor:
  cache:
