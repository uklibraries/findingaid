services:
  findingaid:
    build:
      context: .
    volumes:
      - ./app:/opt/findingaid/app
      - ./public:/opt/findingaid/public
      - ./xml:/opt/findingaid/xml
      - ./tests:/opt/findingaid/tests
      - ./phpunit.xml:/opt/findingaid/phpunit.xml
    networks:
      - app_net

  web:
    image: nginx:1.29.0
    ports:
      - 8080:80
    volumes:
      - ./app:/opt/findingaid/app
      - ./public:/opt/findingaid/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_net
    depends_on:
      - findingaid

volumes:
  app:
  public:

networks:
    app_net:
        driver: bridge
