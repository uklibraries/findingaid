services:
  findingaid:
    build:
      context: .
      target: dev
    volumes:
      - ./app:/app/app
      - ./xml:/app/xml
      - ./public/cache:/app/public/cache
    networks:
      - app_net

  web:
    image: nginx:1.29.0
    ports:
      - 8080:80
    volumes:
      - app:/app
      - ./public:/app/public
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_net
    depends_on:
      - findingaid

networks:
    app_net:
        driver: bridge

volumes:
  app:
